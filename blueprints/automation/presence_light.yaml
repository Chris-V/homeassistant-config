blueprint:
  name: "Presence-activated light"
  description: "Toggle a light based on presence"
  domain: "automation"
  input:
    brightness_based_on_time:
      name: "Brightness based on the time of day."
      description: "Lights will be dimmed late at night and stronger during day."
      default: false
      selector:
        boolean: ~

    delay_off:
      name: "Delay off"
      description: "How long the lights take to turn off after presence is no longer detected."
      selector:
        duration: ~
      default:
        minutes: 5

    light_entity:
      name: "Light"
      description: This light will turn on when presence is detected.
      selector:
        entity:
          filter:
            - domain: "light"

    light_off_entity:
      name: "Light"
      description: >
        Optional. If this light is on, then `light_entity` will not turn on.
        This light will turn off when presence is no longer detected.
        Defaults to `light_entity`.
      selector:
        entity:
          filter:
            - domain: "light"
      default: ""

    presence_entity:
      name: "Presence entity"
      description: "The presence sensor that will be used as a trigger."
      selector:
        entity:
          filter:
            - domain: "binary_sensor"
              device_class:
                - "motion"
                - "presence"

initial_state: true
max_exceeded: "silent"
mode: "queued"

trigger_variables:
  brightness_based_on_time: !input brightness_based_on_time
  light_entity: !input light_entity
  light_off_entity: !input light_off_entity

triggers:
  - id: "turn_on"
    trigger: "state"
    entity_id: !input presence_entity
    from: "off"
    to: "on"
  - id: "turn_off"
    trigger: "state"
    entity_id: !input presence_entity
    from: "on"
    to: "off"
    for: !input delay_off

conditions:
  - condition: "state"
    entity_id: "{{ light_entity }}"
    state: "off"
  - condition: "state"
    enabled: "{{ light_off_entity is not none }}"
    entity_id: "{{ light_off_entity }}"
    state: "off"

actions:
  - if: "{{ trigger.id == 'turn_on' }}"
    then:
      - action: "light.turn_on"
        target:
          entity_id: "{{ light_entity }}"
        data:
          brightness_pct: >-
            {% set time = now().strftime('%H%M') | int %}
            {%- if not brightness_based_on_time -%} 100
            {%- elif time < 700 -%} 10
            {%- elif time >= 2300 -%} 50
            {%- else -%} 100
            {%- endif -%}
    else:
      - action: "light.turn_off"
        target:
          entity_id: "{{ light_off_entity or light_entity }}"
