title: Overview

views:
  - title: Home
    path: home
    icon: mdi:home
    badges: !include badges.yaml
    cards: !include views/home.yaml

  - title: Home Security
    path: security
    icon: mdi:shield-home
    badges: !include badges.yaml
    cards: !include views/security.yaml

  - title: Climate
    path: climate
    icon: mdi:home-thermometer
    badges: !include badges.yaml
    cards: !include views/climate.yaml

  - type: sections
    title: Ground Floor
    path: ground
    icon: mdi:home-floor-g
    badges: !include badges.yaml
    max_columns: 10
    dense_section_placement: true
    sections:
      - type: grid
        column_span: 10
        cards: !include views/ground-floor.yaml

  - type: sections
    title: Basement
    path: basement
    icon: mdi:home-floor-b
    badges: !include badges.yaml
    max_columns: 10
    dense_section_placement: true
    sections:
      - type: grid
        column_span: 10
        cards: !include views/basement.yaml

  - title: Bolt EV
    path: boltev
    subview: true
    icon: mdi:car-electric
    cards: !include views/bolt-ev.yaml

  - title: Plants
    path: plants
    subview: true
    icon: mdi:sprout
    cards: !include views/plants.yaml

  - !template
      file: views/terrarium.yaml.j2
      variables:
        title: Aunt Lydia
        path: lydia
        icon: mdi:snake
        background: /local/animals/lydia.jpg
        entity_prefix: lydia
        power_monitoring: true
        switches:
          - key: outlet_4
            name: Outlet 4
          - key: outlet_5
            name: Outlet 5

  - !template
      file: views/terrarium.yaml.j2
      variables:
        title: Carl
        path: carl
        icon: mdi:snake
        background: /local/animals/carl.jpg
        entity_prefix: carl
        power_monitoring: false
