type: grid
square: false
columns: 3
cards:
  - type: entity-button
    entity: light.outdoor_lights
    name: Outdoor
    icon: mdi:tree
    tap_action:
      action: toggle
    hold_action:
      action: more-info
  - type: entity-button
    entity: light.ground_floor_lights
    name: Main
    icon: mdi:arrow-up-thick
    tap_action:
      action: toggle
    hold_action:
      action: more-info
  - type: entity-button
    entity: light.basement_lights
    name: Basement
    icon: mdi:arrow-down-thick
    tap_action:
      action: toggle
    hold_action:
      action: more-info

  - type: entity-button
    entity: script.evening_ambiance
    name: Ambiance
    tap_action:
      action: perform-action
      perform_action: script.turn_on
      service_data:
        entity_id: script.evening_ambiance
    hold_action:
      action: none
  - type: entity-button
    entity: script.turn_off_unused
    name: Unused
    tap_action:
      action: perform-action
      perform_action: script.turn_on
      service_data:
        entity_id: script.turn_off_unused
    hold_action:
      action: none
  - type: entity-button
    entity: script.everything_off
    name: "Off"
    tap_action:
      action: perform-action
      perform_action: script.turn_on
      service_data:
        entity_id: script.everything_off
    hold_action:
      action: none

  - type: entity-button
    entity: cover.all_blinds
    name: Open Blinds
    icon: mdi:blinds-open
    tap_action:
      action: perform-action
      perform_action: cover.open_cover
      service_data:
        entity_id: cover.all_blinds
    hold_action:
      action: none
  - type: entity-button
    entity: cover.all_blinds
    name: Alternate Blinds
    icon: mdi:blinds
    tap_action:
      action: perform-action
      perform_action: script.alternate_all_blinds
    hold_action:
      action: none
  - type: entity-button
    entity: cover.all_blinds
    name: Close Blinds
    icon: mdi:blinds-closed
    tap_action:
      action: perform-action
      perform_action: script.close_all_blinds
    hold_action:
      action: none
