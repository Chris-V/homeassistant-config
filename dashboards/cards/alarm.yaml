type: entities
entities:
  - type: custom:hui-element
    card_type: heading
    heading: Alarm panel
    heading_style: title
    badges:
      - type: entity
        show_state: true
        show_icon: true
        entity: lock.kitchen_door
        color: state
        hold_action:
          action: more-info
        tap_action:
          action: toggle

  - type: custom:button-card
    entity: binary_sensor.intrusion_activity
    aspect_ratio: 3/1
    color_type: icon
    show_name: false
    styles:
      card:
        - "--ha-card-background": none
        - "--ha-card-box-shadow": none
        - border: 0
        - padding: 0
    state:
      - value: "on"
        color: red
        styles:
          card:
            - animation: blink 2s ease infinite
    tap_action:
      action: more-info

  - type: custom:mini-graph-card
    aggregate_func: max
    cache: false
    group: true
    height: 40
    hours_to_show: 72
    line_width: 1
    points_per_hour: 24
    smoothing: false
    show:
      name: false
      icon: false
      state: false
      labels: false
      labels_secondary: false
      legend: false
      points: false
    entities:
      - entity: binary_sensor.presence_armed
        color: green
        y_axis: secondary
      - entity: binary_sensor.intrusion_activity
        color: red
    state_map:
      - value: "off"
        label: "No"
      - value: "on"
        label: "Yes"
    card_mod:
      style: |
        ha-card {
          --ha-card-background: none;
          border: 0;
        }
