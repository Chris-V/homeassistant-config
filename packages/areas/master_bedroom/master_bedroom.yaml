homeassistant:
  customize:
    light.master_bedroom_bedsides:
      friendly_name: "Master bedroom's bedside lamps"
    sensor.master_bedroom_temperature:
      friendly_name: "Master bedroom temperature"

cloud:
  google_actions:
    filter:
      include_entities:
        - "light.master_bedroom_spots"
        - "light.master_bedroom_bedsides"
        - "light.bedside_chris"
        - "light.bedside_karine"
    entity_config:
      light.master_bedroom:
        aliases:
          - "Bedroom spots"
      light.master_bedroom_bedsides:
        aliases:
          - "Bedside lamps"

input_number:
  master_bedroom_thermostat_eco_setpoint:
    name: "Master bedroom thermostat eco setpoint"
    <<: &setpoint_config
      unit_of_measurement: "°C"
      icon: "mdi:thermometer-lines"
      mode: "box"
      min: 8
      max: 25
      step: 0.5
  master_bedroom_thermostat_comfort_setpoint:
    name: "Master bedroom thermostat comfort setpoint"
    <<: *setpoint_config

input_select:
  master_bedroom_thermostat_auto_mode:
    name: "Master bedroom thermostat auto mode"
    icon: mdi:home-thermometer-outline
    options: ["Comfort", "Eco"]
  master_bedroom_thermostat_mode:
    name: "Master bedroom thermostat mode"
    icon: mdi:home-thermometer-outline
    options: ["Auto", "Manual"]

light:
  - platform: "group"
    unique_id: "master_bedroom_lights"
    name: "Master bedroom lights"
    entities:
      - "light.master_bedroom_sconces"
      - "light.master_bedroom_spots"
      - "light.bedside_chris"
      - "light.bedside_karine"
  - platform: "group"
    unique_id: "master_bedroom_bedsides"
    name: "Master bedroom bedsides"
    entities:
      - "light.bedside_chris"
      - "light.bedside_karine"

template:
  - binary_sensor:
      - unique_id: "d242d93d-9005-4318-a377-ddd8c1cec242"
        default_entity_id: "binary_sensor.master_bed_full"
        name: "Master bed full"
        device_class: "occupancy"
        state: |
          {{
            is_state('binary_sensor.master_bed_occupied_both', 'on')
              or (
                is_state('binary_sensor.master_bed_occupied', 'on')
                and (not is_state('person.chris', 'home') or not is_state('person.karine', 'home'))
              )
          }}

  - sensor:
      - unique_id: "sensor.master_bedroom_temperature"
        default_entity_id: "sensor.master_bedroom_temperature"
        name: "Master bedroom temperature"
        device_class: "temperature"
        unit_of_measurement: "°C"
        state: "{{ states('sensor.master_bedroom_thermostat_temperature') | float(0) | round(1) }}"
        availability: "{{ not is_state('sensor.master_bedroom_thermostat_temperature', 'unavailable') }}"
        attributes:
          heating: "{{ is_state_attr('climate.master_bedroom_thermostat', 'hvac_action', 'heating') }}"

timer:
  master_bedroom_thermostat_manual_mode_reset:
    name: "Reset master bedroom to auto manual mode"
    duration: "01:00:00"
    restore: true

automation:
  - id: "056a609b-bbbc-4969-884e-d5b74c18c32d"
    alias: "master_bed_occupied_day"
    mode: "single"
    max_exceeded: "silent"
    triggers:
      - trigger: "state"
        entity_id:
          - "binary_sensor.master_bed_occupied"
          - "binary_sensor.master_bed_full"
        from: "off"
        to: "on"
        for:
          seconds: 120
    conditions:
      - condition: "time"
        after: "6:00:00"
        before: "21:00:00"
    actions:
      - if:
          - condition: "state"
            entity_id: "binary_sensor.master_bed_full"
            state: "on"
        then:
          - action: "lock.lock"
            target:
              entity_id: "lock.kitchen_door"
          - action: "script.everything_off"
        else:
          - action: "light.turn_off"
            target:
              entity_id: "light.master_bedroom_lights"

  - id: "0197e1c3-9845-713e-aacf-0213e975babc"
    alias: "master_bed_occupied_night"
    mode: "single"
    max_exceeded: "silent"
    triggers:
      - trigger: "state"
        entity_id:
          - "binary_sensor.master_bed_occupied"
          - "binary_sensor.master_bed_full"
        to: "on"
        for:
          seconds: 20
    conditions:
      - condition: "time"
        after: "21:00:00"
        before: "6:00:00"
    actions:
      - action: "lock.lock"
        target:
          entity_id: "lock.kitchen_door"
      - action: "light.turn_off"
        target:
          entity_id:
            - "light.master_bedroom_closet"
            - "light.master_bedroom_sconces"
            - "light.master_bedroom_spots"

      - timeout:
          seconds: 150
        continue_on_timeout: false
        wait_for_trigger:
          - trigger: "state"
            entity_id:
              - "binary_sensor.master_bed_occupied"
              - "binary_sensor.master_bed_full"
            to: "on"
            for:
              seconds: 120

      - if:
          - condition: "state"
            entity_id: "binary_sensor.master_bed_full"
            state: "on"
        then:
          - action: "script.everything_off"
        else:
          - action: "script.turn_off_unused"

  - id: "650fdbf6-2f22-4bd0-b430-c8a1c29d3217"
    alias: "master_bedroom_spots_dimmer_scenes"
    use_blueprint:
      path: "zwave/paddle_scenes.yaml"
      input:
        on_entity_id: "event.master_bedroom_spots_dimmer_on_pressed"
        off_entity_id: "event.master_bedroom_spots_dimmer_off_pressed"

        tap_on_2x:
          - action: "light.turn_on"
            target:
              entity_id: "light.bedside_chris"
        tap_off_2x:
          - action: "light.turn_off"
            target:
              entity_id: "light.bedside_chris"

        tap_on_3x:
          - action: "light.turn_on"
            target:
              entity_id: "light.master_bedroom_lights"
        tap_off_3x:
          - action: "light.turn_off"
            target:
              entity_id: "light.master_bedroom_lights"

  - id: "7d71c23b-929c-4553-a150-2f990fc7ff87"
    alias: "master_bedroom_sconces_dimmer_scenes"
    use_blueprint:
      path: "zwave/paddle_scenes.yaml"
      input:
        on_entity_id: "event.master_bedroom_sconces_dimmer_on_pressed"
        off_entity_id: "event.master_bedroom_sconces_dimmer_off_pressed"

        tap_on_2x:
          - action: "light.turn_on"
            target:
              entity_id: "light.bedside_karine"
        tap_off_2x:
          - action: "light.turn_off"
            target:
              entity_id: "light.bedside_karine"

        tap_on_3x:
          - action: "light.turn_on"
            target:
              entity_id: "light.master_bedroom_lights"
        tap_off_3x:
          - action: "light.turn_off"
            target:
              entity_id: "light.master_bedroom_lights"

  - id: "0a607c5b-9dc1-4e86-b46c-f5dd6ebcc542"
    alias: "master_bedroom_closet_dimmer_scenes"
    use_blueprint:
      path: "zwave/paddle_scenes.yaml"
      input:
        on_entity_id: "event.master_bedroom_closet_light_switch_on_pressed"
        off_entity_id: "event.master_bedroom_closet_light_switch_off_pressed"

        tap_on_2x:
          - action: "light.turn_on"
            target:
              entity_id:
                - "light.master_bedroom_sconces"
                - "light.master_bedroom_spots"
        tap_off_2x:
          - action: "light.turn_off"
            target:
              entity_id: "light.master_bedroom_lights"
