homeassistant:
  customize:
    sensor.main_bathroom_multisensor_battery:
      battery_type: "CR123A"
      battery_warning_level: 40
    sensor.main_bathroom_humidity:
      friendly_name: "Main bathroom humidity"
    sensor.main_bathroom_temperature:
      friendly_name: "Main bathroom temperature"

cloud:
  google_actions:
    filter:
      include_entities:
        - "light.main_bathroom_spots"
        - "light.main_bathroom_vanity"
        - "fan.main_bathroom"
    entity_config:
      light.main_bathroom_spots:
        aliases:
          - "Bathroom light"
          - "Main bathroom light"
      light.main_bathroom_vanity:
        aliases:
          - "Vanity light"
          - "Bathroom vanity light"
      fan.main_bathroom:
        aliases:
          - "Bathroom fan"

template:
  - sensor:
      - unique_id: "sensor.main_bathroom_humidity"
        default_entity_id: "sensor.main_bathroom_humidity"
        name: "Main bathroom humidity"
        device_class: "humidity"
        unit_of_measurement: "%"
        state: "{{ states('sensor.main_bathroom_multisensor_relative_humidity') | int(0) | round }}"
        availability: "{{ not is_state('sensor.main_bathroom_multisensor_relative_humidity', 'unavailable') }}"

      - unique_id: "sensor.main_bathroom_temperature"
        default_entity_id: "sensor.main_bathroom_temperature"
        name: "Main bathroom temperature"
        device_class: "temperature"
        unit_of_measurement: "°C"
        state: "{{ states('sensor.main_bathroom_multisensor_temperature') | int(0) | round(1) }}"
        availability: "{{ not is_state('sensor.main_bathroom_multisensor_temperature', 'unavailable') }}"
        attributes:
          heating: false

light:
  - platform: "group"
    unique_id: "main_bathroom_lights"
    name: "Main bathroom lights"
    entities:
      - "light.main_bathroom_spots"
      - "light.main_bathroom_vanity"

binary_sensor:
  - platform: "group"
    unique_id: "82073d0c-c49d-4525-b4b1-36c2c33732d0"
    name: "Main bathroom motion"
    device_class: "motion"
    entities:
      - "binary_sensor.main_bathroom_spots_dimmer_motion"

automation:
  - id: "8a017369-65d4-4e9b-87dc-0f172fc44594"
    alias: "main_bathroom_auto_fan"
    use_blueprint:
      path: "exhaust_fan.yaml"
      input:
        fan_entity: "fan.main_bathroom"
        humidity_entity: "sensor.main_bathroom_humidity"

  - id: "5bfe8db2-3329-4320-a8b8-7f07cd12430e"
    alias: "main_bathroom_motion_lights"
    use_blueprint:
      path: "presence_light.yaml"
      input:
        light_entity: "light.main_bathroom_spots"
        light_off_entity: "light.main_bathroom_lights"
        presence_entity: "binary_sensor.main_bathroom_motion"
        brightness_based_on_time: true

  - id: "b5437d3b-e443-4de5-9b47-a0f296d94395"
    alias: "main_bathroom_motion_lights_toggle"
    initial_state: true
    triggers:
      - id: "toggle"
        trigger: "state"
        entity_id: "event.main_bathroom_spots_dimmer_favorite_pressed"
        not_from: "unavailable"
      - id: "turn_on"
        trigger: "time"
        at: "03:00:00"
    actions:
      - action: "automation.{{ trigger.id }}"
        target:
          entity_id: "automation.main_bathroom_motion_lights"

  - id: "bdcb209a-0966-4017-a700-f715d24ec6f4"
    alias: "main_bathroom_spots_dimmer_led"
    initial_state: true
    mode: "queued"
    triggers:
      - id: "motion_lights_disabled"
        trigger: "state"
        entity_id: "automation.main_bathroom_motion_lights"
        from: "on"
        to: "off"
        variables:
          duration: 142
          level: 25
      - id: "motion_lights_enabled"
        trigger: "state"
        entity_id: "automation.main_bathroom_motion_lights"
        from: "off"
        to: "on"
        variables:
          duration: 0
          level: 0
    actions:
      - action: "zwave_js.bulk_set_partial_config_parameters"
        target:
          entity_id: "light.main_bathroom_spots"
        data:
          parameter: 94
          value:
            0xFF: "{{ duration }}"
            0xFF00: "{{ level }}"
            0xFF0000: 0
            0xFF000000: "Solid"
