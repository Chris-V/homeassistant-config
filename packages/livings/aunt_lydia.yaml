homeassistant:
  customize:
    binary_sensor.lydia_requires_attention:
      friendly_name: "Lydia requires attention"
    switch.lydia_heat_bulb:
      icon: "mdi:spotlight-beam"
    switch.lydia_heater:
      icon: "mdi:radiator"
    switch.lydia_uv_light:
      icon: "mdi:weather-sunny"

input_boolean:
  lydia_scheduled_heat_bulb:
    name: "Schedule Lydia's heat bulb"
    icon: "mdi:spotlight-beam"
  lydia_scheduled_heater:
    name: "Schedule Lydia's heater"
    icon: "mdi:radiator"
  lydia_scheduled_uv:
    name: "Schedule Lydia's UV"
    icon: "mdi:weather-sunny"

input_datetime:
  lydia_day_time:
    name: "When Lydia's terrarium lights turn on"
    icon: "mdi:clock-start"
    has_date: false
    has_time: true
  lydia_night_time:
    name: "When Lydia's terrarium lights turn off"
    icon: "mdi:clock-end"
    has_date: false
    has_time: true

template:
  - trigger:
      - platform: "time"
        at:
          - "input_datetime.lydia_day_time"
          - "input_datetime.lydia_night_time"
      - platform: "state"
        entity_id:
          - "input_datetime.lydia_day_time"
          - "input_datetime.lydia_night_time"
        to: ~
      - trigger: "homeassistant"
        event: "start"
    binary_sensor:
      - unique_id: "04982c95-c1d2-4566-8514-a29fb0ea91aa"
        default_entity_id: "binary_sensor.lydia_scheduling_active"
        name: "Lydia scheduling is active"
        state: >-
          {{
            now() >= states('input_datetime.lydia_day_time') | today_at
              and now() <= states('input_datetime.lydia_night_time') | today_at
          }}
  - binary_sensor:
      - unique_id: "cca4e02a-aadf-42f1-93d6-468e78d44877"
        default_entity_id: "binary_sensor.lydia_requires_attention"
        name: "Lydia requires attention"
        device_class: "problem"
        picture: "/local/animals/slinky_avatar.jpg"
        attributes:
          heat_bulb: >-
            {{
              is_state('input_boolean.lydia_scheduled_heat_bulb', 'on')
                and is_state('binary_sensor.lydia_scheduling_active', 'on')
                and (is_state('switch.lydia_heat_bulb', 'off') or states('sensor.lydia_heat_bulb_power') | float(0) == 0)
            }}
          heater: >-
            {{
              is_state('input_boolean.lydia_scheduled_heater', 'on')
                and is_state('binary_sensor.lydia_scheduling_active', 'on')
                and (is_state('switch.lydia_heater', 'off') or states('sensor.lydia_heater_power') | float(0) == 0)
            }}
          uv_light: >-
            {{
              is_state('input_boolean.lydia_scheduled_uv', 'on')
                and is_state('binary_sensor.lydia_scheduling_active', 'on')
                and (is_state('switch.lydia_uv_light', 'off') or states('sensor.lydia_uv_light_power') | float(0) == 0)
            }}
        state: >-
          {{
            this.attributes.heat_bulb | default(True)
              or this.attributes.heater | default(True)
              or this.attributes.uv_light | default(True)
          }}

automation:
  - id: "ca115276-80d4-4a82-bd6e-b575f6483b64"
    alias: "lydia_scheduling"
    use_blueprint:
      path: "terrarium_scheduling.yaml"
      input:
        schedule_heat_bulb: "input_boolean.lydia_scheduled_heat_bulb"
        schedule_heater: "input_boolean.lydia_scheduled_heater"
        schedule_uv_light: "input_boolean.lydia_scheduled_uv"
        day_time_entity: "input_datetime.lydia_day_time"
        night_time_entity: "input_datetime.lydia_night_time"
        heat_bulb_switch: "switch.lydia_heat_bulb"
        heater_switch: "switch.lydia_heater"
        uv_light_switch: "switch.lydia_uv_light"

  - id: "bb248f37-e829-45dc-99f3-f21bf86dea5c"
    alias: "lydia_uv_monitoring"
    use_blueprint:
      path: "device_stopped_consuming.yaml"
      input:
        delay: &power_delay 310  # Wattage report rate is 5 minutes
        entity_id: "switch.lydia_uv_light"
        power_sensor: "sensor.lydia_uv_light_power"
        action:
          - action: "python_script.notify"
            data:
              <<: &power_notification_data
                audio: true
                persistent: true
                push_target: "household"
                title: "Check Aunt Lydia"
                url: "/lovelace/lydia"
              tag: "lydia_uv_monitoring"
              message: "Aunt Lydia's UV light has burned out."

  - id: "99bb793a-f44c-4f8a-99e4-079c59056d51"
    alias: "lydia_heat_bulb_monitoring"
    use_blueprint:
      path: "device_stopped_consuming.yaml"
      input:
        delay: *power_delay
        entity_id: "switch.lydia_heat_bulb"
        power_sensor: "sensor.lydia_heat_bulb_power"
        action:
          - action: "python_script.notify"
            data:
              <<: *power_notification_data
              tag: "lydia_heat_bulb_monitoring"
              message: "Aunt Lydia's heat bulb has burned out."

  - id: "97c82da0-9eed-462c-a2d5-46da5209ffb3"
    alias: "lydia_heater_monitoring"
    use_blueprint:
      path: "device_stopped_consuming.yaml"
      input:
        delay: *power_delay
        entity_id: "switch.lydia_heater"
        power_sensor: "sensor.lydia_heater_power"
        action:
          - action: "python_script.notify"
            data:
              <<: *power_notification_data
              tag: "lydia_heater_monitoring"
              message: "Aunt Lydia's ceramic heater has burned out."
