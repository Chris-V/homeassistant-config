cloud:
  google_actions:
    filter:
      include_entities:
        - "script.evening_ambiance"
    entity_config:
      script.evening_ambiance:
        aliases:
          - "Ambiance"

input_datetime:
  evening_ambiance_end:
    name: "End of evening ambiance triggers"
    icon: "mdi:star-face"
    has_date: false
    has_time: true

script:
  evening_ambiance:
    alias: "Evening ambiance"
    icon: "mdi:lamp"
    mode: "restart"
    sequence:
      parallel:
        - action: "cover.close_cover"
          target:
            entity_id:
              - "cover.living_room_blinds"
              - "cover.kitchen_sink_blinds"
        - action: "cover.set_cover_position"
          target:
            entity_id:
              - "cover.kitchen_counter_blinds"
          data:
            position: 10
        - action: "cover.set_cover_position"
          target:
            entity_id:
              - "cover.dining_room_blinds"
          data:
            position: 9

        - action: "light.turn_on"
          target:
            entity_id:
              - "light.backyard_string"
              - "light.front_porch"
              - "light.side_porch_sconce"
              - "light.shed_outdoor"
              - "light.bookshelf"
        - action: "light.turn_on"
          target:
            entity_id: "light.office_lamp"
          data:
            brightness_pct: 10
        - action: "light.turn_on"
          target:
            entity_id: "light.basement_hallway"
          data:
            brightness_pct: 40
        - action: "light.turn_on"
          target:
            entity_id: "light.lounge_ambiance"
          data:
            brightness_pct: 30
            color_temp_kelvin: 2200

        - if:
            - condition: "state"
              entity_id: "binary_sensor.master_bed_occupied"
              state: "off"
          then:
            - action: "light.turn_on"
              target:
                entity_id: "light.master_bedroom_bedsides"
              data:
                brightness_pct: 5
                color_temp_kelvin: 2200

automation:
  - id: "a4fe52e0-99f0-449d-9bc7-50378d9d6df8"
    alias: "night_ambiance"
    initial_state: true
    mode: "restart"
    triggers:
      - trigger: "state"
        entity_id: "binary_sensor.dark_outside"
        from: "off"
        to: "on"
      - trigger: "state"
        entity_id: "group.household"
        to: "home"
    conditions:
      - condition: "time"
        before: "input_datetime.evening_ambiance_end"
      - condition: "state"
        entity_id: "binary_sensor.master_bed_occupied"
        state: "off"
      - condition: "state"
        entity_id: "binary_sensor.dark_outside"
        state: "on"
      - condition: "state"
        entity_id: "group.household"
        state: "home"
    actions:
      - action: "script.evening_ambiance"

  - id: "2c48ecbc-7b65-4938-af37-dcda12952465"
    alias: "arrival_lights"
    initial_state: true
    mode: "restart"
    triggers:
      - trigger: state
        entity_id:
          - "person.chris"
          - "person.karine"
          - "group.guests"
        to: "home"
    conditions:
      - condition: "state"
        entity_id: "binary_sensor.dark_outside"
        state: "on"
    actions:
      - action: "light.turn_on"
        target:
          entity_id:
            - "light.front_porch"
            - "light.side_porch_sconce"

      - if:
          - condition: "state"
            entity_id: "binary_sensor.master_bed_occupied"
            state: "off"
        then:
          - action: "light.turn_on"
            target:
              entity_id: "light.master_bedroom_bedsides"
            data:
              brightness_pct: 5
              color_temp_kelvin: 2200
        else:
          - action: "light.turn_on"
            target:
              entity_id:
                - "light.main_bathroom_spots"
                - "light.staircase"
            data:
              brightness_pct: 10


  - id: "a109af89-0910-45b2-9a0e-11d3ae43ec7c"
    alias: "turn_off_outdoor"
    initial_state: true
    mode: "restart"
    triggers:
      - trigger: "state"
        entity_id: "binary_sensor.dark_outside"
        to: "off"
      - trigger: "state"
        entity_id: "binary_sensor.master_bed_full"
        to: "on"
    conditions:
      - condition: "state"
        entity_id: "binary_sensor.guest_mode"
        state: "off"
    actions:
      - action: "light.turn_off"
        target:
          entity_id: "light.outdoor_lights"
